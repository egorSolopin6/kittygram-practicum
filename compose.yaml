name: kittygram
services:
  web:
    build: .
    image: kittygram-web:local
    init: true
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file: .env
    environment:
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-true}
    volumes:
      - kittygram_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
volumes:
  kittygram_data:
    name: kittygram_data
